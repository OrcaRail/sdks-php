name: PHP SDK

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # CI has no credentials for repo.packagist.com, so resolve dependencies
      # from public packagist.org instead of the private mirror.
      - name: Use public Packagist in CI
        run: |
          jq 'del(.repositories)' composer.json > composer.tmp && mv composer.tmp composer.json
          rm -f composer.lock
      - uses: ramsey/composer-install@v3
      - run: composer test
      - run: composer analyse
      - run: composer cs-check
